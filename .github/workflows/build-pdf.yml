name: Generate CV PDF and Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    container:
      image: pandoc/latex:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Liberation fonts
        run: |
          apk add --no-cache fontconfig ttf-liberation
          fc-cache -fv

      - name: Generate PDF filename
        id: pdf_name
        run: |
          PDF_NAME="cv_benedetti_ignacio.pdf"
          echo "pdf_name=$PDF_NAME" >> $GITHUB_OUTPUT
          echo "Generated PDF name: $PDF_NAME"

      - name: Convert Markdown to PDF
        run: |
          pandoc index.md -o ${{ steps.pdf_name.outputs.pdf_name }} \
            --pdf-engine=xelatex \
            -V geometry:margin=0.8in \
            -V fontsize=10pt \
            -V linestretch=1.15 \
            -V mainfont="Liberation Sans" \
            -V papersize=a4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pdf_name.outputs.pdf_name }}
          generate_release_notes: true
          body: |
            ## CV - Ignacio Juan Martín Benedetti

            PDF del CV generado automáticamente desde `index.md`

            **Descarga:** ${{ steps.pdf_name.outputs.pdf_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}